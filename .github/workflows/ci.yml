
name: CareInsight ML CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-frontend.txt

      # 3. Install backend and frontend dependencies
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-api.txt
          python -m pip install -r requirements-frontend.txt
          python -m pip install pytest httpx

      # 4. Check syntax of all Python modules
      - name: Check Python syntax
        run: |
          python -m compileall -q api app ml tests

      # 5. Run automated API tests
      - name: Run API tests
        run: |
          python -m pytest tests/test_api.py -v

      # 6. Build FastAPI Docker image
      - name: Build API image
        run: |
          docker build \
            -f docker/Dockerfile.api \
            -t careinsight-api .

      # 7. Build Streamlit Docker image
      - name: Build frontend image
        run: |
          docker build \
            -f docker/Dockerfile.frontend \
            -t careinsight-frontend .
